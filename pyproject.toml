[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optsim"
version = "0.1.0"
description = "Optical / Machine Vision Imaging Simulator with Telecentric Lens"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Optical Simulator Project" }]

dependencies = [
    "numpy>=1.26,<2.2",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "trimesh>=4.4",
    "rtree>=1.2",
    "opencv-python>=4.9",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
    "imageio>=2.34",
    "pillow>=10.0",
    "tqdm>=4.66",
    "click>=8.1",
]

[project.optional-dependencies]
render = [
    "mitsuba>=3.5.0",
]
gui = [
    "PyQt6>=6.6",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "qtawesome>=1.3",
    "pytest-qt>=4.4",
]
package = [
    "pyinstaller>=6.5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
step = [
    "cascadio>=0.0.13",
]
all = [
    "mitsuba>=3.5.0",
    "PyQt6>=6.6",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "qtawesome>=1.3",
    "cascadio>=0.0.13",
]

[project.scripts]
optsim = "optsim.cli:main"
optsim-gui = "optsim.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
optsim = ["presets/*.yaml", "presets/*.json"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# PyQt6: signals use camelCase; widgets override Qt event handlers.
"src/optsim/gui/**" = ["N802", "N815"]
# Public API name kept for compatibility with existing callers.
"src/optsim/render/cancellation.py" = ["N818"]
# Common linear-algebra shorthand in ray-intersection helpers.
"src/optsim/render/renderer.py" = ["N806", "N803"]

[tool.pytest.ini_options]
testpaths = ["tests"]
