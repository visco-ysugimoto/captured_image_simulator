name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libspatialindex-dev xvfb

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          # GUI extras (PyQt6) are not required for headless pytest; omitting them
          # avoids libEGL / display-server issues on ubuntu-latest runners.
          pip install -e ".[dev,step]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        # pytest-qt auto-loads PyQt6 at startup; we have no Qt widget tests yet.
        run: xvfb-run -a pytest -q -p no:pytestqt
